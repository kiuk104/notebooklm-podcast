<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NotebookLM 팟캐스트 관리자</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 14px; }
  label { display: block; margin-top: 16px; font-size: 14px; font-weight: 600; }
  input[type="date"], input[type="text"], input[type="file"] {
    width: 100%; padding: 8px 10px; margin-top: 4px; box-sizing: border-box;
    font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
  }
  button { margin-top: 24px; padding: 12px 24px; font-size: 15px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .flash { padding: 12px 14px; border-radius: 6px; margin-bottom: 20px; white-space: pre-wrap; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; line-height: 1.5; }
  .flash.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .flash.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; font-weight: normal; }
</style>
</head>
<body>
<h1>NotebookLM 팟캐스트 관리자</h1>
<p class="sub">mp3 업로드 → RSS 재생성 → git push 를 한 번에</p>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <label>날짜
    <input type="date" name="date" value="{{ today }}" required>
  </label>

  <label>노트북 이름
    <input type="text" name="notebook" placeholder="예: AI 논문정리" required>
    <div class="hint">공백은 자동으로 하이픈(-)으로 변환됩니다.</div>
  </label>

  <label>에피소드 제목
    <input type="text" name="title" placeholder="예: Attention is all you need" required>
  </label>

  <label>mp3 파일
    <input type="file" name="file" accept="audio/mpeg,.mp3" required>
  </label>

  <button type="submit">업로드 + 배포</button>
</form>
</body>
</html>
