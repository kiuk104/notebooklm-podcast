# 푸시된 docs/ 를 GitHub Pages 로 배포만 한다.
#
# RSS 재생성은 로컬 admin (또는 cron) 이 push 직전에 이미 처리한다
# (src/main.py 가 docs/feed.xml + docs/index.html 까지 만들어 commit). 여기서
# 또 generate 하면 lastBuildDate 한 줄만 달라져 매번 race 가 났었다.

name: Deploy podcast feed to GitHub Pages

on:
  push:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
